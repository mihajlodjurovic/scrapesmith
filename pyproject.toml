[project]
name = "scrapesmith"
version = "0.1.0"
description = "Turn a URL into a validated, polite Python scraper + mapper bundle."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/reference/*" = ["E501"]
"tests/*" = ["E501"]
